<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobAI Pro - Intelligent Career Automation</title>
<style>
/* --- PREMIUM MODERN UI --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-main: #f4f7f9;
  --surface: rgba(255, 255, 255, 0.9);
  --surface-solid: #ffffff;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: rgba(79, 70, 229, 0.1);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: rgba(203, 213, 225, 0.7);
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.1);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.1);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
  --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
  --shadow-md: 0 8px 16px rgba(0,0,0,0.04);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  background: var(--bg-main);
  background-image: radial-gradient(circle at 20% 40%, rgba(79, 70, 229, 0.05), transparent 40%), radial-gradient(circle at 80% 60%, rgba(16, 185, 129, 0.05), transparent 40%);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 1200px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
#ml { position: relative; z-index: 100; }

.card {
  background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
  transition: transform 0.2s, box-shadow 0.2s;
}

h1, h2, h3 { color: var(--text-main); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
p { line-height: 1.6; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: var(--radius-md); border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.bp { background: var(--primary); color: white; }
.bp:hover:not(:disabled) { background: var(--primary-hover); }
.bs { background: white; border: 1px solid var(--border); color: var(--text-main); }
.bs:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.bg { background: var(--success); color: white; }
.bg:hover:not(:disabled) { background: #059669; }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-xs { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }

.inp {
  width: 100%; padding: 12px 16px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface-solid);
  font-size: 14px; color: var(--text-main); outline: none; transition: 0.2s;
}
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.ta { resize: vertical; line-height: 1.6; }

.nav {
  display: flex; gap: 4px; background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px); border: 1px solid var(--border);
  padding: 6px; border-radius: var(--radius-lg); margin-bottom: 24px; overflow-x: auto;
}
.nb {
  display: flex; align-items: center; gap: 8px; padding: 10px 18px;
  border-radius: var(--radius-md); border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s;
}
.nb:hover:not(.on) { background: rgba(255,255,255,0.9); color: var(--text-main); }
.nb.on { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }

.chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.cg { background: var(--success-bg); color: #065f46; }
.ca { background: var(--warning-bg); color: #92400e; }
.cp { background: var(--primary-light); color: var(--primary); }

.clist { display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 12px; max-width: 85%; }
.msg.u { align-self: flex-end; flex-direction: row-reverse; }
.bub { padding: 12px 18px; border-radius: var(--radius-lg); font-size: 14px; line-height: 1.6; }
.msg.ai .bub { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg.u .bub { background: var(--primary); color: white; border-top-right-radius: 4px; }
.av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: var(--primary-light); }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media(max-width: 768px) { .g3, .g4 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }

.stat { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; text-align: center; }
.sv { font-size: 32px; font-weight: 800; color: var(--primary); line-height: 1; }
.sl { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
.sr { border-radius: 50%; border: 4px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 70px; flex-shrink: 0; }

.kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 16px; padding-bottom: 12px; }
.kcol { background: rgba(255,255,255,0.4); border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 12px; min-height: 300px; }
.kc { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
.kc:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }

.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; animation: sp .6s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes sp { to { transform: rotate(360deg) } }
.fu { animation: fadeUp 0.3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
pre { white-space: pre-wrap; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ml"></div>

<script>
// ─── ARCHITECTURE SETTINGS ───
const PROXY = window.location.protocol === 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

// ─── STATE MANAGEMENT ───
const S = {
  gKey:'', rKey:'', model:'gemini-2.0-flash-lite',
  profile:null, cv:'', chat:[], jobs:[], apps:[],
  tab:'dash', step:0, busy:false,
  jd:null, draft:null, draftCtx:{}, lastQ:'', lastL:'Bengaluru'
};

const R = (k) => { try { return localStorage.getItem('jai_'+k) } catch { return null } };
const W = (k, v) => { try { localStorage.setItem('jai_'+k, typeof v==='string'?v:JSON.stringify(v)) } catch {} };

function persist() {
  W('gk', S.gKey); W('rk', S.rKey); W('mod', S.model);
  W('cv', S.cv.slice(0,9000)); W('pf', JSON.stringify(S.profile));
  W('ap', JSON.stringify(S.apps)); W('ch', JSON.stringify(S.chat.slice(-30)));
}

function hydrate() {
  S.gKey = R('gk')||''; S.rKey = R('rk')||''; S.model = R('mod')||'gemini-2.0-flash-lite';
  S.cv = R('cv')||'';
  try { S.profile = JSON.parse(R('pf')); } catch { S.profile = null; }
  try { S.apps = JSON.parse(R('ap'))||[]; } catch { S.apps = []; }
  try { S.chat = JSON.parse(R('ch'))||[]; } catch { S.chat = []; }
}

// ─── UTILITIES ───
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fd = s => s ? new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '—';
const ago = s => s ? Math.floor((Date.now()-new Date(s))/86400000) : 0;
const today= () => new Date().toISOString().split('T')[0];
const scC = n => n>=75?'var(--success)':n>=50?'var(--warning)':'var(--danger)';
const scBg = n => n>=75?'var(--success-bg)':n>=50?'var(--warning-bg)':'var(--danger-bg)';
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function md(s){ return String(s||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>') }

// ─── API CONNECTORS ───
async function callGemini(contents, temp=0.7, maxTok=2048) {
  const body = { contents, generationConfig:{temperature:temp, maxOutputTokens:maxTok} };
  const headers = { 'Content-Type': 'application/json' };
  if (PROXY && S.gKey) headers['x-user-gemini-key'] = S.gKey;
  
  const url = PROXY ? '/api/gemini' : `https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${S.gKey}`;
  const r = await fetch(url, {method:'POST', headers, body:JSON.stringify(body)});
  if (!r.ok) { const e=await r.json().catch(()=>({})); throw new Error(e.error?.message||'Gemini error'); }
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function gemini(prompt, temp=0.7, maxTok=2048) { return callGemini([{role:'user', parts:[{text:prompt}]}], temp, maxTok); }
async function geminiChat(userMsg, system, history=[]) {
  const contents = [{role:'user', parts:[{text:system}]}, {role:'model', parts:[{text:'Understood.'}]}];
  history.forEach(m => contents.push({role:m.r==='ai'?'model':'user', parts:[{text:m.t}]}));
  contents.push({role:'user', parts:[{text:userMsg}]});
  return callGemini(contents);
}

function parseJSON(t) {
  const c = t.replace(/```json|```/g,'').trim();
  const ci = c.indexOf('{'), di = c.lastIndexOf('}'), ai = c.indexOf('['), bi = c.lastIndexOf(']');
  if (ai!==-1 && bi!==-1 && (ci===-1 || ai<ci)) return JSON.parse(c.slice(ai,bi+1));
  if (ci!==-1 && di!==-1) return JSON.parse(c.slice(ci,di+1));
  throw new Error('No JSON in response');
}

async function jsearch(query, loc) {
  const q = encodeURIComponent(query+' '+loc);
  const headers = {};
  if (PROXY && S.rKey) headers['x-user-search-key'] = S.rKey;
  else if (!PROXY) { headers['X-RapidAPI-Key'] = S.rKey; headers['X-RapidAPI-Host'] = 'jsearch.p.rapidapi.com'; }

  const url = PROXY ? `/api/jsearch?query=${q}&page=1&num_pages=2&date_posted=week` : `https://jsearch.p.rapidapi.com/search?query=${q}&page=1&num_pages=2&date_posted=week`;
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error('JSearch error. Verify your RapidAPI key.');
  return (await r.json()).data || [];
}

async function scoreJobs(raw) {
  if (!raw.length) return [];
  const lines = raw.map((j,i)=> `[${i}] "${j.job_title}" at ${j.employer_name}\nSkills: ${(j.job_required_skills||[]).join(', ')||j.job_description?.slice(0,150)||'N/A'}`).join('\n---\n');
  const prompt = `Score each job. Candidate: Role: ${S.profile.currentRole} | Exp: ${S.profile.yearsExp}yrs | Skills: ${(S.profile.skills||[]).join(', ')}. JOBS:\n${lines}\nReturn ONLY a JSON array, exactly ${raw.length} items: [{"i":0,"score":82,"matched":["Python"],"missing":["Kafka"],"tag":"Good fit"}]`;
  return parseJSON(await gemini(prompt, 0.2, 1500));
}

// ─── RENDER ENGINE ───
function render() {
  const needSetup = (!S.gKey && !PROXY) || !S.profile;
  document.getElementById('app').innerHTML = needSetup ? renderSetup() : renderApp();
  bindEvents();
  const cb = document.getElementById('cb'); if (cb) cb.scrollTop = cb.scrollHeight;
}

function renderSetup() {
  if (S.step===0) return `
<div style="min-height:90vh;display:flex;align-items:center;justify-content:center;">
<div style="width:100%;max-width:480px">
  <div style="text-align:center;margin-bottom:32px">
    <h1 style="font-size:32px;color:var(--primary);margin-bottom:8px;">JobAI Pro</h1>
    <p style="color:var(--text-muted);">Intelligent Career Automation</p>
  </div>
  <div class="card" style="padding:32px">
    ${PROXY?`<div style="padding:12px;background:var(--success-bg);color:var(--success);border-radius:var(--radius-md);margin-bottom:20px;font-size:13px;font-weight:600;">✓ Secure Proxy Mode Active</div>`:''}
    <div style="margin-bottom:20px">
      <label style="font-size:13px;font-weight:600;display:flex;justify-content:space-between">Gemini API Key <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--primary);text-decoration:none;">Get free key →</a></label>
      <input class="inp" id="i-gk" type="password" placeholder="AIzaSy..." value="${esc(S.gKey)}" style="margin-top:8px;">
    </div>
    <div style="margin-bottom:24px">
      <label style="font-size:13px;font-weight:600;display:flex;justify-content:space-between">RapidAPI Key (Optional) <a href="https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch" target="_blank" style="color:var(--primary);text-decoration:none;">Get key →</a></label>
      <input class="inp" id="i-rk" type="password" placeholder="For live Job Search feature..." value="${esc(S.rKey)}" style="margin-top:8px;">
    </div>
    <button class="btn bp" id="s0-btn" style="width:100%;padding:14px;font-size:15px;">Save & Continue</button>
  </div>
</div></div>`;

  if (S.step===1) return `
<div style="min-height:90vh;display:flex;align-items:center;justify-content:center;">
<div style="width:100%;max-width:600px">
  <div style="text-align:center;margin-bottom:24px"><h2 style="font-size:24px;">Upload your CV</h2><p style="color:var(--text-muted);margin-top:8px;">Paste your text below or upload a .txt file to initialize your career profile.</p></div>
  <div class="card" style="padding:24px">
    <textarea class="inp ta" id="i-cv" placeholder="Paste your complete CV / resume here..." style="min-height:300px;margin-bottom:16px;">${esc(S.cv)}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <label class="btn bs btn-sm" style="cursor:pointer">📎 Upload .txt <input type="file" id="i-file" accept=".txt" style="display:none"></label>
      <span id="fn" style="font-size:12px;color:var(--text-muted)"></span>
    </div>
    <button class="btn bp" id="s1-btn" style="width:100%;padding:14px;">${S.busy ? '<span class="spin"></span> Processing...' : 'Analyze CV'}</button>
  </div>
</div></div>`;

  return `
<div style="min-height:90vh;display:flex;align-items:center;justify-content:center;">
<div style="width:100%;max-width:640px">
  <div class="card" style="overflow:hidden">
    <div style="padding:16px 24px;background:rgba(255,255,255,0.5);border-bottom:1px solid var(--border);font-weight:700;">Profile Setup Assistant</div>
    <div id="cb" class="clist" style="padding:24px;height:400px;overflow-y:auto">
      ${S.chat.map(m=>`<div class="msg ${m.r==='ai'?'ai':'u'}"><div class="av">${m.r==='ai'?'🤖':'👤'}</div><div class="bub">${md(esc(m.t))}</div></div>`).join('')}
      ${S.busy ? `<div class="msg ai"><div class="av">🤖</div><div class="bub"><span class="spin" style="border-color:var(--primary);border-top-color:transparent;"></span></div></div>` : ''}
    </div>
    <div style="padding:16px;border-top:1px solid var(--border);display:flex;gap:12px;background:rgba(255,255,255,0.5);">
      <input class="inp" id="ci" placeholder="Type answer..." style="flex:1" ${S.busy?'disabled':''}>
      <button class="btn bp" id="cs" ${S.busy?'disabled':''}>Send</button>
    </div>
  </div>
</div></div>`;
}

function renderApp() {
  const tabs = [
    {id:'dash', l:'🏠 Dashboard'}, {id:'hunt', l:'🔍 Job Hunt'}, {id:'analyze', l:'🧠 Analyzer'},
    {id:'tracker', l:'📋 Tracker'}, {id:'drafts', l:'✉️ Drafts'}, {id:'profile', l:'👤 Profile'}
  ];
  const body = {dash:tDash, hunt:tHunt, analyze:tAnalyze, tracker:tTracker, drafts:tDrafts, profile:tProfile}[S.tab]?.() || '';
  
  return `
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
  <h1 style="font-size:24px;color:var(--primary);">JobAI <span style="color:var(--text-main);font-weight:500;">Pro</span></h1>
  <div style="display:flex;gap:12px;">
    <button class="btn bs btn-sm" onclick="openSettings()">⚙ Settings</button>
    <button class="btn bs btn-sm" id="rst">Reset</button>
  </div>
</div>
<div class="nav">${tabs.map(t=>`<button class="nb ${S.tab===t.id?'on':''}" data-t="${t.id}">${t.l}</button>`).join('')}</div>
<div class="fu">${body}</div>`;
}

// ─── TAB 1: DASHBOARD
function tDash() {
  return `<div class="g4" style="margin-bottom:24px;">
    <div class="stat"><div class="sv">${S.apps.length}</div><div class="sl">Total Tracked</div></div>
    <div class="stat"><div class="sv" style="color:var(--success)">${S.apps.filter(a=>a.status==='interview').length}</div><div class="sl">Interviews</div></div>
    <div class="stat"><div class="sv" style="color:var(--primary)">${S.profile?.yearsExp||0}</div><div class="sl">Years Exp</div></div>
    <div class="stat"><div class="sv" style="color:var(--warning)">${S.apps.filter(a=>a.status==='saved').length}</div><div class="sl">Saved Jobs</div></div>
  </div>
  <div class="card" style="padding:48px;text-align:center;">
    <h3 style="margin-bottom:12px;font-size:24px;">Ready for your next application?</h3>
    <p style="color:var(--text-muted);margin-bottom:24px;">Your profile is locked in. Let the AI find and tailor your next move.</p>
    <div style="display:flex;justify-content:center;gap:16px;">
      <button class="btn bp" onclick="goTab('hunt')">🔍 Search Live Jobs</button>
      <button class="btn bs" onclick="goTab('analyze')">🧠 Analyze a JD</button>
    </div>
  </div>`;
}

// ─── TAB 2: JOB HUNT
function tHunt() {
  return `<div class="card" style="padding:24px;">
    <h2 style="margin-bottom:8px;">🔍 Live Job Aggregator</h2>
    <p style="color:var(--text-muted);margin-bottom:24px;">Searches internet and auto-scores each listing against your profile.</p>
    <div class="g2" style="margin-bottom:16px;">
      <input class="inp" id="sq" placeholder="Keywords (e.g. Product Manager)" value="${esc(S.lastQ)}">
      <input class="inp" id="sl" placeholder="Location (e.g. Bengaluru)" value="${esc(S.lastL)}">
    </div>
    <button class="btn bp" id="hunt-btn">${S.busy&&!S.jobs.length?'<span class="spin"></span> Searching...':'Search & Score Jobs'}</button>
  </div>
  <div style="margin-top:24px;">${S.jobs.sort((a,b)=>b.score-a.score).map(j=>`
    <div class="card" style="padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="openJob('${j.id}')">
      <div><h3 style="font-size:16px;margin-bottom:4px;">${esc(j.job_title)}</h3><p style="color:var(--text-muted);font-size:13px;">${esc(j.employer_name)}</p></div>
      <div class="sr" style="border-color:${scC(j.score)};width:60px;height:60px;"><span style="font-weight:700;color:${scC(j.score)}">${j.score}%</span></div>
    </div>`).join('')}
  </div>`;
}

// ─── TAB 3: ANALYZER
function tAnalyze() {
  return `<div class="card" style="padding:24px;">
    <h2 style="margin-bottom:8px;">🧠 Job Description Analyzer</h2>
    <p style="color:var(--text-muted);margin-bottom:16px;">Paste a JD. AI will do exact date math and gap analysis without hallucinating skills.</p>
    <textarea class="inp ta" id="jd-ta" placeholder="Paste full Job Description here..." style="min-height:180px;margin-bottom:16px;"></textarea>
    <button class="btn bp" id="analyze-btn">${S.busy&&!S.jd?'<span class="spin"></span> Analyzing...':'Analyze Match'}</button>
  </div>
  ${S.jd ? `<div class="card" style="padding:24px;margin-top:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3>${esc(S.jd.roleName)} at ${esc(S.jd.company)}</h3>
      <div class="sr" style="border-color:${scC(S.jd.score)};width:70px;height:70px;"><span style="font-weight:700;font-size:20px;color:${scC(S.jd.score)}">${S.jd.score}%</span></div>
    </div>
    <div style="background:var(--bg-main);padding:16px;border-radius:var(--radius-md);margin-bottom:16px;"><strong>Verdict:</strong> ${esc(S.jd.verdict)}</div>
    <div class="g2" style="margin-bottom:16px;">
      <div><strong style="color:var(--success);font-size:13px;">Matched Skills</strong><div style="margin-top:8px;">${(S.jd.matchedSkills||[]).map(s=>`<span class="chip cg" style="margin:2px;">${esc(s)}</span>`).join('')}</div></div>
      <div><strong style="color:var(--danger);font-size:13px;">Missing Skills</strong><div style="margin-top:8px;">${(S.jd.missingSkills||[]).map(s=>`<span class="chip ca" style="margin:2px;">${esc(s)}</span>`).join('')}</div></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:20px;">
      <button class="btn bp btn-sm" onclick="draftFromJD()">✉️ Auto-Draft Outreach</button>
      <button class="btn bs btn-sm" onclick="saveJDToTracker()">🔖 Save to Tracker</button>
    </div>
  </div>` : ''}`;
}

// ─── TAB 4: TRACKER
function tTracker() {
  const cols = [{id:'saved',l:'Saved'}, {id:'applied',l:'Applied'}, {id:'followup',l:'Follow-up'}, {id:'interview',l:'Interview'}, {id:'offer',l:'Offer'}];
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2>📋 Application Tracker</h2>
    <div style="display:flex;gap:8px;">
      <button class="btn bs btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn bp btn-sm" id="add2-btn">+ Add Job</button>
    </div>
  </div>
  <div class="kanban">
    ${cols.map(c=>`<div class="kcol"><h3 style="font-size:13px;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;font-weight:700;">${c.l}</h3>
      ${S.apps.filter(a=>a.status===c.id).map(a=>`<div class="kc" onclick="openApp('${a.id}')"><strong style="font-size:14px;display:block;margin-bottom:4px;">${esc(a.role)}</strong><p style="font-size:12px;color:var(--text-muted);">${esc(a.company)}</p></div>`).join('')}
    </div>`).join('')}
  </div>`;
}

// ─── TAB 5: DRAFTS
function tDrafts() {
  const d = S.draft || {};
  return `<div class="card" style="padding:24px;margin-bottom:24px;">
    <h2 style="margin-bottom:8px;">✉️ Zero-Hallucination Drafter</h2>
    <p style="color:var(--text-muted);margin-bottom:16px;">Generates networking messages strictly using your CV data.</p>
    <div class="g2" style="margin-bottom:16px;">
      <div><label style="font-size:13px;font-weight:600;">Company</label><input class="inp" id="d-co" value="${esc(S.draftCtx.co||'')}"></div>
      <div><label style="font-size:13px;font-weight:600;">Role</label><input class="inp" id="d-ro" value="${esc(S.draftCtx.ro||'')}"></div>
      <div><label style="font-size:13px;font-weight:600;">Type</label><select class="inp" id="d-ty"><option value="cold" ${S.draftCtx.ty==='cold'?'selected':''}>Cold Email</option><option value="linkedin" ${S.draftCtx.ty==='linkedin'?'selected':''}>LinkedIn Message</option></select></div>
    </div>
    <button class="btn bp" id="draft-btn">${S.busy&&!d.body?'<span class="spin"></span> Drafting...':'Generate Outreach'}</button>
  </div>
  ${d.body ? `<div class="card" style="padding:24px;">
    ${d.sub ? `<div style="margin-bottom:12px;"><strong>Subject:</strong> ${esc(d.sub)}</div>` : ''}
    <div style="background:var(--bg-main);padding:16px;border-radius:var(--radius-md);margin-bottom:16px;"><pre>${esc(d.body)}</pre></div>
    <div style="display:flex;gap:12px;">
      <button class="btn bp btn-sm" id="copy-btn">📋 Copy</button>
      ${S.draftCtx.ty==='cold'?`<a href="mailto:?subject=${encodeURIComponent(d.sub)}&body=${encodeURIComponent(d.body)}" class="btn bs btn-sm">Open Mail</a>`:''}
    </div>
  </div>` : ''}`;
}

// ─── TAB 6: PROFILE
function tProfile() {
  const p = S.profile;
  if(!p) return `<p>No profile</p>`;
  return `<div class="card" style="padding:32px;"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><h2 style="font-size:28px;margin-bottom:8px;">${esc(p.name)}</h2><span class="chip cp" style="font-size:14px;">${p.yearsExp} YOE</span></div><p style="color:var(--text-muted);margin-bottom:24px;font-size:16px;">${esc(p.currentRole)} · ${esc(p.location)}</p>
  <h3 style="font-size:14px;margin-bottom:12px;">Verified Skills</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">${(p.skills||[]).map(s=>`<span class="chip cg">${esc(s)}</span>`).join('')}</div>
  <h3 style="font-size:14px;margin-bottom:12px;">Target Roles</h3><div style="display:flex;gap:8px;flex-wrap:wrap;">${(p.targetRoles||[]).map(s=>`<span class="chip cp">${esc(s)}</span>`).join('')}</div></div>`;
}

// ─── MODALS & SETTINGS ───
function openSettings() {
  modal(`
    <h2 style="margin-bottom:16px;">⚙ API Settings</h2>
    <label style="font-size:13px;font-weight:600;">Gemini API Key</label>
    <input class="inp" id="cfg-gk" type="password" value="${esc(S.gKey)}" style="margin-bottom:16px;">
    <label style="font-size:13px;font-weight:600;">RapidAPI Key</label>
    <input class="inp" id="cfg-rk" type="password" value="${esc(S.rKey)}" style="margin-bottom:24px;">
    <div style="display:flex;gap:12px;"><button class="btn bs" onclick="closeM()">Cancel</button><button class="btn bp" onclick="S.gKey=document.getElementById('cfg-gk').value;S.rKey=document.getElementById('cfg-rk').value;persist();closeM();render();">Save locally</button></div>
  `);
}

function openJob(id) {
  const j = S.jobs.find(x=>x.id===id); if(!j) return;
  modal(`
    <h3 style="margin-bottom:4px;">${esc(j.job_title)}</h3><p style="color:var(--text-muted);margin-bottom:16px;">${esc(j.employer_name)}</p>
    <div style="display:flex;gap:12px;margin-bottom:16px;">${(j.matched||[]).map(s=>`<span class="chip cg">${esc(s)}</span>`).join('')}</div>
    <div style="background:var(--bg-main);padding:12px;border-radius:var(--radius-md);margin-bottom:20px;max-height:150px;overflow-y:auto;font-size:13px;">${esc((j.job_description||'').slice(0,500))}...</div>
    <div style="display:flex;gap:8px;"><button class="btn bp btn-sm" onclick="closeM();draftFromJob('${j.id}')">✉️ Email</button><button class="btn bs btn-sm" onclick="closeM();markApplied('${j.id}')">✓ Mark Applied</button></div>
  `);
}

function openApp(id) {
  const a = S.apps.find(x=>x.id===id); if(!a) return;
  modal(`
    <h3 style="margin-bottom:4px;">${esc(a.role)}</h3><p style="color:var(--text-muted);margin-bottom:16px;">${esc(a.company)}</p>
    <label style="font-size:13px;font-weight:600;">Status</label>
    <select class="inp" style="margin-bottom:24px;" onchange="updStatus('${a.id}',this.value)">
      <option value="saved" ${a.status==='saved'?'selected':''}>Saved</option>
      <option value="applied" ${a.status==='applied'?'selected':''}>Applied</option>
      <option value="followup" ${a.status==='followup'?'selected':''}>Follow-up</option>
      <option value="interview" ${a.status==='interview'?'selected':''}>Interview</option>
      <option value="offer" ${a.status==='offer'?'selected':''}>Offer</option>
    </select>
    <div style="display:flex;gap:8px;"><button class="btn bs btn-sm" onclick="closeM();triggerFollowup('${a.id}')">✉️ Follow-up</button><button class="btn btn-sm" style="background:var(--danger-bg);color:var(--danger);" onclick="delApp('${a.id}')">Delete</button></div>
  `);
}

function addAppModal() {
  modal(`
    <h3 style="margin-bottom:16px;">+ Add Application</h3>
    <input class="inp" id="m-ro" placeholder="Role *" style="margin-bottom:12px;">
    <input class="inp" id="m-co" placeholder="Company *" style="margin-bottom:24px;">
    <div style="display:flex;gap:12px;"><button class="btn bs" onclick="closeM()">Cancel</button><button class="btn bp" onclick="saveApp()">Save</button></div>
  `);
}

function modal(html) {
  document.getElementById('ml').innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:999;" onclick="if(event.target===this)closeM()"><div class="card" style="padding:32px;width:100%;max-width:480px;position:relative;"><button onclick="closeM()" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-muted);">×</button>${html}</div></div>`;
}
function closeM() { document.getElementById('ml').innerHTML=''; }

// ─── LOGIC HANDLERS ───
function bindEvents() {
  const on = (id,fn) => { const e=document.getElementById(id); if(e) e.onclick=fn; };
  on('s0-btn', ()=>{ S.gKey=document.getElementById('i-gk')?.value; S.rKey=document.getElementById('i-rk')?.value; persist(); S.step=1; render(); });
  const fi = document.getElementById('i-file'); if(fi) fi.onchange=e=>{ const f=e.target.files[0]; if(!f)return; document.getElementById('fn').textContent=f.name; const r=new FileReader(); r.onload=ev=>{document.getElementById('i-cv').value=ev.target.result;}; r.readAsText(f); };
  on('s1-btn', ()=>{ S.cv=document.getElementById('i-cv')?.value; S.step=2; persist(); render(); setTimeout(startChat,100); });
  on('cs', sendChat);
  const ci=document.getElementById('ci'); if(ci) ci.onkeydown=e=>{if(e.key==='Enter')sendChat();};
  document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>goTab(b.dataset.t));
  on('rst', ()=>{ if(!confirm('Reset everything?')) return; Object.assign(S,{profile:null,chat:[],apps:[],jobs:[],cv:'',step:0,busy:false}); persist(); render(); });
  on('hunt-btn', doHunt); on('analyze-btn', doAnalyze); on('draft-btn', doDraft);
  on('copy-btn', ()=>{ navigator.clipboard.writeText(document.getElementById('dp').textContent); document.getElementById('copy-btn').textContent='✅ Copied'; });
  on('add2-btn', addAppModal);
}

function goTab(t){ S.tab=t; render(); }

async function startChat() {
  S.busy=true; render();
  try{ const r = await gemini(`You are JobAI. Ask 5 quick questions to finalize profile (Goal, Salary, Location, Co. Type, Top Achievement). NO HALLUCINATION. CV:\n${S.cv}`); S.chat.push({r:'ai',t:r}); }catch(e){}
  S.busy=false; persist(); render();
}

async function sendChat() {
  const t=document.getElementById('ci')?.value; if(!t)return; S.chat.push({r:'user',t}); S.busy=true; render();
  try {
    const r = await geminiChat(t, `Extract JSON profile. RULES: exact date math for yearsExp. NO HALLUCINATION. CV:${S.cv}. Reply ONLY with JSON inside <PROFILE></PROFILE> schema: {"name":"","currentRole":"","yearsExp":0,"location":"","skills":[],"targetRoles":[]}`, S.chat.slice(0,-1));
    const m = r.match(/<PROFILE>([\s\S]*?)<\/PROFILE>/);
    if(m) { S.profile=JSON.parse(m[1]); S.tab='dash'; } else S.chat.push({r:'ai',t:r});
  } catch(e){}
  S.busy=false; persist(); render();
}

async function doHunt() {
  S.busy=true; S.jobs=[]; render();
  try { S.jobs = await jsearch(document.getElementById('sq').value, document.getElementById('sl').value); const sc = await scoreJobs(S.jobs); S.jobs=S.jobs.map((j,i)=>({...j, ...(sc.find(x=>x.i===i)||{score:60})})); }catch(e){}
  S.busy=false; render();
}

async function doAnalyze() {
  const jd=document.getElementById('jd-ta').value; S.busy=true; render();
  try{ S.jd = parseJSON(await gemini(`Compare Candidate to JD. Return JSON: {"roleName":"","company":"","score":0,"verdict":"","matchedSkills":[],"missingSkills":[]}. CANDIDATE: ${JSON.stringify(S.profile)}. JD: ${jd}`, 0.2)); }catch(e){}
  S.busy=false; render();
}

async function doDraft() {
  const co=document.getElementById('d-co').value, ro=document.getElementById('d-ro').value, ty=document.getElementById('d-ty').value; S.busy=true; render();
  try { const r = await gemini(`Write a ${ty} for ${ro} at ${co} using ONLY profile facts. First line: SUBJECT: [sub]\n\n[body]. CANDIDATE: ${JSON.stringify(S.profile)}`, 0.6); const l=r.split('\n'); S.draftCtx.ty=ty; S.draft={sub:l[0].replace('SUBJECT:','').trim(), body:l.slice(1).join('\n').trim()}; }catch(e){}
  S.busy=false; render();
}

function draftFromJob(id){ const j=S.jobs.find(x=>x.id===id); S.draftCtx={co:j.employer_name,ro:j.job_title,ty:'cold'}; S.tab='drafts'; render(); }
function draftFromJD(){ S.draftCtx={co:S.jd.company,ro:S.jd.roleName,ty:'cold'}; S.tab='drafts'; render(); }
function triggerFollowup(id){ const a=S.apps.find(x=>x.id===id); S.draftCtx={co:a.company,ro:a.role,ty:'linkedin'}; S.tab='drafts'; render(); }
function markApplied(id){ const j=S.jobs.find(x=>x.id===id); S.apps.push({id:uid(),jobId:id,role:j.job_title,company:j.employer_name,score:j.score,url:j.job_apply_link||'',date:today(),status:'applied'}); persist(); }
function saveJDToTracker(){ S.apps.push({id:uid(),role:S.jd.roleName,company:S.jd.company,score:S.jd.score,date:today(),status:'saved'}); persist(); S.tab='tracker'; render(); }
function saveApp(){ S.apps.push({id:uid(),role:document.getElementById('m-ro').value,company:document.getElementById('m-co').value,date:today(),status:'saved'}); persist(); closeM(); render(); }
function updStatus(id,st){ const a=S.apps.find(x=>x.id===id); if(a){a.status=st;persist();closeM();render();} }
function delApp(id){ S.apps=S.apps.filter(x=>x.id!==id); persist(); closeM(); render(); }
function exportCSV(){ const rows=[['Role','Company','Status','Date'].join(','), ...S.apps.map(a=>`"${a.role}","${a.company}","${a.status}","${a.date}"`)]; const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURI(rows.join('\n')); a.download='tracker.csv'; a.click(); }

hydrate(); if(S.profile && (S.gKey||PROXY)) S.step=3; render();
</script>
</body>
</html>
