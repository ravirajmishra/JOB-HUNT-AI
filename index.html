<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobAI Pro</title>
<style>
/* --- PREMIUM MODERN UI (Clean, High-Contrast, Professional) --- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-main: #f1f5f9;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: rgba(79, 70, 229, 0.1);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border: rgba(203, 213, 225, 0.6);
  --border-focus: #818cf8;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.1);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.1);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 9999px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-main);
  background-image: radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.04), transparent 25%), radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.04), transparent 25%);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 1200px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }
#mr { position: relative; z-index: 100; }

/* Cards & Surfaces */
.card {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  transition: transform 0.2s, box-shadow 0.2s;
}

/* Typography */
h1, h2, h3 { color: var(--text-main); font-weight: 700; letter-spacing: -0.02em; }
p { line-height: 1.6; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 20px; border-radius: var(--radius-md); border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  white-space: nowrap; line-height: 1.2;
}
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

.bp { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
.bp:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-md); }
.bs { background: white; border: 1px solid var(--border); color: var(--text-main); }
.bs:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.bg { background: var(--success); color: white; }
.bg:hover:not(:disabled) { background: #059669; }
.br { background: var(--danger-bg); color: var(--danger); border: 1px solid transparent; }
.br:hover:not(:disabled) { background: var(--danger); color: white; }

.sm { padding: 8px 14px; font-size: 13px; }
.xs { padding: 6px 10px; font-size: 12px; border-radius: var(--radius-sm); }

/* Inputs */
.inp {
  width: 100%; padding: 12px 16px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface-solid);
  font-size: 14px; color: var(--text-main); outline: none; transition: all 0.2s;
}
.inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.inp.ok { border-color: var(--success); }
.ta { resize: vertical; line-height: 1.6; }

/* Navigation */
.nav {
  display: flex; gap: 4px; background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px); border: 1px solid var(--border);
  padding: 6px; border-radius: var(--radius-lg); margin-bottom: 24px; overflow-x: auto;
}
.nb {
  display: flex; align-items: center; gap: 8px; padding: 10px 18px;
  border-radius: var(--radius-md); border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s;
}
.nb:hover:not(.on) { background: rgba(255,255,255,0.8); color: var(--text-main); }
.nb.on { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }

/* Badges & Chips */
.chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; }
.cg { background: var(--success-bg); color: #065f46; }
.ca { background: var(--warning-bg); color: #92400e; }
.cp { background: var(--primary-light); color: var(--primary); }
.cr { background: var(--danger-bg); color: #991b1b; }

/* Chat Bubbles */
.clist { display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 12px; max-width: 85%; }
.msg.u { align-self: flex-end; flex-direction: row-reverse; }
.bub { padding: 12px 18px; border-radius: var(--radius-lg); font-size: 14px; line-height: 1.6; }
.msg.ai .bub { background: white; border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg.u .bub { background: var(--primary); color: white; border-top-right-radius: 4px; }
.av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.msg.ai .av { background: var(--primary-light); color: var(--primary); }
.msg.u .av { background: var(--border); color: var(--text-muted); }

/* Layouts */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media(max-width: 768px) { .g3, .g4 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }

/* Stats & Score Rings */
.stat { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; text-align: center; }
.sv { font-size: 32px; font-weight: 800; color: var(--primary); line-height: 1; }
.sl { font-size: 13px; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
.sr { border-radius: 50%; border: 4px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 80px; height: 80px; flex-shrink: 0; }

/* Tracker Kanban */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 16px; padding-bottom: 12px; }
.kcol { background: rgba(255,255,255,0.4); border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 12px; min-height: 300px; }
.kcard { background: white; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm); }
.kcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-focus); }

/* Utilities */
.spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; animation: sp .6s linear infinite; display: inline-block; vertical-align: middle; }
.spin-p { width: 32px; height: 32px; border-width: 3px; border-color: var(--primary-light); border-top-color: var(--primary); }
@keyframes sp { to { transform: rotate(360deg) } }
.fu { animation: fadeUp 0.3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

pre.code { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; background: #1e293b; color: #f8fafc; padding: 16px; border-radius: var(--radius-md); overflow-x: auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="mr"></div>

<script>
// ── FAIL-SAFE ERROR HANDLER ──
window.addEventListener('error', function(e){
  const app = document.getElementById('app');
  if(app) app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;"><div class="card" style="padding:40px;max-width:480px;text-align:center"><h2 style="color:var(--danger);margin-bottom:12px;">App Error</h2><p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">${e.message}</p><button onclick="localStorage.clear();location.reload()" class="btn bp">Reset Application</button></div></div>`;
});

const PROXY = window.location.protocol === 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

// ── SVG ICONS ──
const svg = (d,w=18,h=18) => `<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {

  mail:     svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7L12 13 2 7"/>'),

  check:    svg('<polyline points="20,6 9,17 4,12"/>'),
  trash:    svg('<polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>'),

  upload:   svg('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
  file:     svg('<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/>'),
  send:     svg('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/>'),
  link:     svg('<path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>'),
  plus:     svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  key:      svg('<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>')
};

// ── STATE & STORAGE (LocalDB) ──
const S = {
  gKey:'', rKey:'', model:'gemini-2.0-flash-lite',
  profile:null, cv:'', chat:[], jobs:[], apps:[],
  tab:'dash', step:0, busy:false,
  jd:null, drafts:{}, draftCtx:{}, lastQ:'', lastL:'Bengaluru', resumeOutput:null
};

const DB = {
  set(k,v){ try{localStorage.setItem('jai3_'+k, typeof v==='string'?v:JSON.stringify(v));return true}catch{return false} },
  get(k,fb=null){ try{const r=localStorage.getItem('jai3_'+k);return r===null?fb:JSON.parse(r)}catch{return fb} },
  clear(){ try{Object.keys(localStorage).filter(k=>k.startsWith('jai3_')).forEach(k=>localStorage.removeItem(k))}catch{} }
};

function save(){
  DB.set('gk',S.gKey); DB.set('rk',S.rKey); DB.set('mod',S.model);
  DB.set('cv',S.cv.slice(0,9000)); DB.set('pf',S.profile); DB.set('ap',S.apps); DB.set('ch',S.chat.slice(-30));
}

function load(){
  S.gKey = DB.get('gk',''); S.rKey = DB.get('rk',''); S.model = DB.get('mod','gemini-2.0-flash-lite');
  S.cv = DB.get('cv',''); S.profile = DB.get('pf',null); S.apps = DB.get('ap',[]); S.chat = DB.get('ch',[]);
}

// ── UTILS ──
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today= () => new Date().toISOString().split('T')[0];
const fd2 = s => s ? new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '—';
const scC = n => n>=75?'var(--success)':n>=50?'var(--warning)':'var(--danger)';
const scBg = n => n>=75?'var(--success-bg)':n>=50?'var(--warning-bg)':'var(--danger-bg)';
const scCl = n => n>=75?'cg':n>=50?'ca':'cr';
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function md(s){ return String(s||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>') }
function dlBlob(content, name, type='text/plain'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name; a.click();
}
function copyText(t,btn){
  navigator.clipboard.writeText(t).then(()=>{
    if(btn){const o=btn.innerHTML;btn.innerHTML=I.check+' Copied!';setTimeout(()=>btn.innerHTML=o,2000);}
  });
}

// ── API HANDLERS (With Secure Sandbox Mode logic) ──
async function callGemini(contents, temp=0.7, maxTok=2048) {
  const body = { contents, generationConfig: { temperature: temp, maxOutputTokens: maxTok } };
  const headers = { 'Content-Type': 'application/json' };
  
  // If deployed on Vercel, pass custom keys in headers so backend can override
  if (PROXY) {
    if (S.gKey) headers['x-user-gemini-key'] = S.gKey;
  }

  const url = PROXY ? '/api/gemini' : `https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${S.gKey}`;
  
  const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error?.message || e.error || 'Gemini API error '+r.status); }
  
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

async function gem(p, temp=0.7, max=2048) { return callGemini([{role:'user',parts:[{text:p}]}], temp, max); }

async function jsearch(q, loc) {
  const enc = encodeURIComponent(q + ' ' + loc);
  const headers = {};
  
  if (PROXY) {
    if (S.rKey) headers['x-user-search-key'] = S.rKey; // Tell backend to use user's RapidAPI key if provided
  } else {
    headers['X-RapidAPI-Key'] = S.rKey;
    headers['X-RapidAPI-Host'] = 'jsearch.p.rapidapi.com';
  }

  const url = PROXY ? `/api/jsearch?query=${enc}&page=1&num_pages=2&date_posted=week` : `https://jsearch.p.rapidapi.com/search?query=${enc}&page=1&num_pages=2&date_posted=week`;
  
  const r = await fetch(url, { headers });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.message || e.error || 'JSearch error '+r.status); }
  
  return (await r.json()).data || [];
}

function pJSON(t) {
  const c = t.replace(/```json|```/g,'').trim();
  const ci = c.indexOf('{'), di = c.lastIndexOf('}'), ai = c.indexOf('['), bi = c.lastIndexOf(']');
  if(ai !== -1 && bi !== -1 && (ci === -1 || ai < ci)) return JSON.parse(c.slice(ai, bi+1));
  if(ci !== -1 && di !== -1) return JSON.parse(c.slice(ci, di+1));
  throw new Error('No JSON found');
}

// ── RENDER ENGINE ──
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  const needKey = !PROXY && !S.gKey;
  const needCV  = !S.profile;
  
  if(needKey || needCV) { app.innerHTML = renderSetup(); } 
  else { app.innerHTML = renderApp(); }
  
  bindEvents();
}

// ── SETUP & ONBOARDING ──

          </div>
          <button class="btn bp" id="s0" style="width:100%;padding:14px;font-size:15px;">Save & Continue ${I.send}</button>
        </div>

  }
  
  if(S.step===1) {

      <div style="width:100%;max-width:600px">

          <div id="cb" class="clist" style="padding:24px;height:400px;overflow-y:auto">
            ${S.chat.map(m=>`<div class="msg ${m.r==='ai'?'ai':'u'}"><div class="av">${m.r==='ai'?I.brain:I.user}</div><div class="bub">${md(esc(m.t))}</div></div>`).join('')}
            ${S.busy ? `<div class="msg ai"><div class="av">${I.brain}</div><div class="bub"><span class="spin"></span></div></div>` : ''}
          </div>
          <div style="padding:16px;border-top:1px solid var(--border);display:flex;gap:12px;">
            <input class="inp" id="ci" placeholder="Type answer..." style="flex:1" ${S.busy?'disabled':''}>
            <button class="btn bp" id="cs" ${S.busy?'disabled':''}>${I.send}</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ── MAIN APPLICATION ──
function renderApp(){
  const tabs = [
    {id:'dash', l:'Dashboard', ic:I.home}, {id:'hunt', l:'Job Hunt', ic:I.search}, {id:'analyze', l:'Analyzer', ic:I.brain},
    {id:'tracker', l:'Tracker', ic:I.list}, {id:'drafts', l:'Drafts', ic:I.mail}, {id:'resume', l:'Resume', ic:I.file}, {id:'profile', l:'Profile', ic:I.user}
  ];
  
  const body = {dash:tDash, hunt:tHunt, analyze:tAnalyze, tracker:tTracker, drafts:tDrafts, resume:tResume, profile:tProfile}[S.tab]?.() || '';
  
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
    <h1 style="font-size:24px;color:var(--primary);">JobAI <span style="color:var(--text-main);font-weight:500;">Pro</span></h1>
    <div style="display:flex;gap:12px;">
      <button class="btn bs sm" onclick="openSettings()">${I.settings} Settings</button>
    </div>
  </div>
  <div class="nav">${tabs.map(t=>`<button class="nb ${S.tab===t.id?'on':''}" data-t="${t.id}">${t.ic}${t.l}</button>`).join('')}</div>
  <div class="fu">${body}</div>`;
}

function tDash() {
  return `<div class="g4" style="margin-bottom:24px;">
    <div class="stat"><div class="sv">${S.apps.length}</div><div class="sl">Total Tracked</div></div>
    <div class="stat"><div class="sv" style="color:var(--success)">${S.apps.filter(a=>a.status==='interview').length}</div><div class="sl">Interviews</div></div>
    <div class="stat"><div class="sv" style="color:var(--primary)">${S.profile?.yearsExp||0}</div><div class="sl">Years Exp</div></div>
    <div class="stat"><div class="sv" style="color:var(--warning)">${S.apps.filter(a=>a.status==='saved').length}</div><div class="sl">Saved Jobs</div></div>
  </div>
  <div class="card" style="padding:48px;text-align:center;">
    <div style="color:var(--border);margin-bottom:16px;">${svg('<circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>',48,48)}</div>
    <h3 style="margin-bottom:12px;">Ready for your next application?</h3>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:24px;">
      <button class="btn bp" onclick="goTab('hunt')">${I.search} Search Jobs</button>
      <button class="btn bs" onclick="goTab('analyze')">${I.brain} Analyze a JD</button>
    </div>
  </div>`;
}

function tHunt() {
  return `<div class="card" style="padding:24px;">
    <h2 style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">${I.search} Live Job Aggregator</h2>
    <p style="color:var(--text-muted);margin-bottom:24px;">Searches internet and auto-scores against your profile.</p>
    <div class="g2" style="margin-bottom:16px;">
      <input class="inp" id="sq" placeholder="Keywords (e.g. Product Manager)" value="${esc(S.lastQ)}">
      <input class="inp" id="sl" placeholder="Location (e.g. Bengaluru)" value="${esc(S.lastL)}">
    </div>
    <button class="btn bp" id="hunt-btn">${S.busy&&!S.jobs.length?'<span class="spin"></span> Searching...':'Search Jobs'}</button>
  </div>
  <div style="margin-top:24px;">${S.jobs.map(j=>`
    <div class="card" style="padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
      <div><h3 style="font-size:16px;margin-bottom:4px;">${esc(j.job_title)}</h3><p style="color:var(--text-muted);font-size:13px;">${esc(j.employer_name)}</p></div>
      <div class="sr" style="border-color:${scC(j.score)};width:60px;height:60px;"><span style="font-weight:700;color:${scC(j.score)}">${j.score}%</span></div>
    </div>`).join('')}
  </div>`;
}

function tAnalyze() {
  return `<div class="card" style="padding:24px;">
    <h2 style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">${I.brain} Job Description Analyzer</h2>
    <p style="color:var(--text-muted);margin-bottom:16px;">Paste a JD. AI will do exact date math and gap analysis without hallucinating.</p>
    <textarea class="inp ta" id="jd-ta" placeholder="Paste full Job Description here..." style="min-height:150px;margin-bottom:16px;"></textarea>
    <button class="btn bp" id="analyze-btn">${S.busy&&!S.jd?'<span class="spin"></span> Analyzing...':'Analyze Match'}</button>
  </div>
  ${S.jd ? `<div class="card" style="padding:24px;margin-top:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3>${esc(S.jd.roleName)} at ${esc(S.jd.company)}</h3>
      <span class="chip ${scCl(S.jd.score)}">${S.jd.score}% Match</span>
    </div>
    <p style="background:var(--bg-main);padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:14px;">${esc(S.jd.verdict)}</p>
    <div style="display:flex;gap:12px;"><button class="btn bp sm" onclick="draftFromJD()">${I.mail} Auto-Draft Outreach</button></div>
  </div>` : ''}`;
}

function tTracker() {
  const cols = [{id:'saved',l:'Saved'}, {id:'applied',l:'Applied'}, {id:'interview',l:'Interview'}, {id:'offer',l:'Offer'}];
  return `<div style="display:flex;justify-content:space-between;margin-bottom:16px;">
    <h2>Application Tracker</h2>
    <button class="btn bs sm" onclick="exportCSV()">${I.download} Export CSV</button>
  </div>
  <div class="kanban">
    ${cols.map(c=>`<div class="kcol"><h3 style="font-size:14px;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase;">${c.l}</h3>
      ${S.apps.filter(a=>a.status===c.id).map(a=>`<div class="kcard" onclick="delApp('${a.id}')"><strong style="font-size:14px;">${esc(a.role)}</strong><p style="font-size:12px;color:var(--text-muted);">${esc(a.company)}</p></div>`).join('')}
    </div>`).join('')}
  </div>`;
}

function tDrafts() {
  const d = S.drafts || {};
  return `<div class="card" style="padding:24px;margin-bottom:24px;">
    <h2 style="margin-bottom:16px;">Outreach Auto-Drafter</h2>
    <div class="g2" style="margin-bottom:16px;">
      <input class="inp" id="d-co" placeholder="Company" value="${esc(S.draftCtx.co||'')}">
      <input class="inp" id="d-ro" placeholder="Role" value="${esc(S.draftCtx.ro||'')}">
    </div>
    <button class="btn bp" id="draft-btn">${S.busy&&!Object.keys(d).length?'<span class="spin"></span> Drafting...':'Generate Outreach Package'}</button>
  </div>
  ${Object.keys(d).length ? `<div class="g2">
    ${Object.entries(d).map(([type, data]) => {
      let actionBtn = '';
      if(type==='cold') actionBtn = `<a href="mailto:?subject=${encodeURIComponent(data.sub)}&body=${encodeURIComponent(data.body)}" class="btn bp xs">${I.mail} Open Email</a>`;
      if(type==='whatsapp') actionBtn = `<a href="https://wa.me/?text=${encodeURIComponent(data.body)}" target="_blank" class="btn bg xs">WhatsApp</a>`;
      if(type==='linkedin') actionBtn = `<a href="https://linkedin.com/messaging" target="_blank" class="btn bp xs">Open LinkedIn</a>`;
      return `<div class="card" style="padding:16px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;"><strong>${type.toUpperCase()}</strong> ${actionBtn}</div>
        <pre class="code" style="white-space:pre-wrap;">${esc(data.body)}</pre>
      </div>`;
    }).join('')}
  </div>` : ''}`;
}

function tResume() {
  return `<div class="card" style="padding:24px;">
    <h2 style="margin-bottom:16px;">Resume Generator (LaTeX & HTML)</h2>
    <button class="btn bp" id="gen-res-btn">${S.busy&&!S.resumeOutput?'<span class="spin"></span> Generating...':'Generate Tailored Resume'}</button>
    ${S.resumeOutput ? `<div style="margin-top:24px;">
      <h3 style="margin-bottom:12px;">LaTeX Source Code</h3>
      <pre class="code" style="max-height:300px;">${esc(S.resumeOutput.latex)}</pre>
    </div>` : ''}
  </div>`;
}

function tProfile() {
  const p = S.profile;
  if(!p) return `<p>No profile</p>`;
  return `<div class="card" style="padding:24px;"><h2 style="margin-bottom:8px;">${esc(p.name)}</h2><p style="color:var(--text-muted);margin-bottom:16px;">${esc(p.currentRole)} · ${p.yearsExp} YOE</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">${(p.skills||[]).map(s=>`<span class="chip cp">${esc(s)}</span>`).join('')}</div></div>`;
}
